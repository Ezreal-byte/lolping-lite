[workspace]
members = ["backend"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.image]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
