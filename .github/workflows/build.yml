name: Build native Windows, macOS and Linux apps

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      linux_artifact_run_id:
        description: 'Optional: rerun GNOME tests against a previously built Linux artifact from this repository'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.linux_artifact_run_id == '' }}
    name: ${{ matrix.target }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            arch: x64
          - os: macos-15
            target: macos-arm64
            arch: arm64
          - os: ubuntu-22.04
            target: linux-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.96.0'
      - name: Linux native libraries and private desktop test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libasound2-dev libx11-dev libxi-dev libxtst-dev libxrandr-dev libxinerama-dev libxcursor-dev libxkbcommon-dev libxkbcommon-x11-dev libayatana-appindicator3-dev libgl1-mesa-dev libegl1-mesa-dev libfuse2 squashfs-tools desktop-file-utils xvfb xauth xcompmgr openbox dbus-x11 dconf-gsettings-backend
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Verify runner architecture and Rust version
        run: |
          node -e "if (process.arch !== '${{ matrix.arch }}') throw Error('Unexpected runner architecture ' + process.arch)"
          rustc --version
      - run: npm ci --ignore-scripts
      - name: GNOME extension protocol and package boundaries
        run: node --test scripts/test-gnome-package.mjs scripts/test-wayland-extension.mjs
      - run: npm run build:resources
      - run: npm run test:helper
      - run: cargo test --locked
      - name: Windows benchmark process identity regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/benchmark/test-process-tree.ps1
      - name: Linux helper input integration
        if: runner.os == 'Linux'
        run: python3 native/hook-helper/tests/linux_x11_test.py
      - name: Linux composited surface regressions at two scales
        if: runner.os == 'Linux'
        run: python3 scripts/test-linux-surface.py
      - run: cargo build --release --locked
      - name: Stage signed/native application layout
        run: node scripts/package.mjs --stage-only
      # Hosted macOS cannot grant Accessibility; hosted Windows cannot represent
      # the user's mixed-DPI desktop. Their real-desktop checks remain manual.
      - name: Windows/macOS isolated lifecycle smoke
        if: runner.os != 'Linux'
        run: node scripts/standalone-smoke.mjs --no-desktop
      - name: Linux X11 lifecycle smoke in an isolated desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x960x24 +extension Composite +extension RENDER" dbus-run-session -- sh -c 'xcompmgr -n & compositor=$!; trap "kill $compositor 2>/dev/null || true" EXIT; sleep 1; LOLPING_PRIVATE_XVFB=1 XDG_SESSION_TYPE=x11 GDK_BACKEND=x11 node scripts/standalone-smoke.mjs'
      - name: Build installable and portable artifacts
        run: npm run package
      - name: Verify signed payload, resource indexes and hashes
        run: npm run verify:package
      - name: Linux extracted AppImage desktop and bundled library smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x960x24 +extension Composite +extension RENDER" dbus-run-session -- sh -c 'xcompmgr -n & compositor=$!; trap "kill $compositor 2>/dev/null || true" EXIT; sleep 1; LOLPING_PRIVATE_XVFB=1 XDG_SESSION_TYPE=x11 GDK_BACKEND=x11 node scripts/appimage-smoke.mjs'
      - name: Windows per-user install, upgrade and uninstall acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Execute
      - uses: actions/upload-artifact@v4
        with:
          name: lolping-lite-${{ matrix.target }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.artifact.json
            dist/*report.json
            dist/SHA256SUMS-*.txt
            docs/performance*.md
            docs/performance*.json
            docs/validation-0.2.0.md
            docs/ui-0.2.0-*.json
            design-qa.md
            THIRD_PARTY_NOTICES.md

  gnome-wayland:
    name: Ubuntu 24.04 GNOME 46 Wayland integration
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.linux_artifact_run_id != '')) }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install private GNOME compositor test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell gnome-shell-common gnome-session-bin gsettings-desktop-schemas xwayland xvfb xauth xdotool dbus-x11 dconf-gsettings-backend dconf-service python3-gi gir1.2-gtk-3.0 ripgrep libgtk-3-0t64 libasound2t64 libayatana-appindicator3-1 libxkbcommon-x11-0 libegl1 libgl1-mesa-dri
          gnome-shell --version
      - uses: actions/download-artifact@v4
        with:
          name: lolping-lite-linux-x64
          path: .cache/gnome-wayland-artifacts
          run-id: ${{ inputs.linux_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Extract the verified AppImage without FUSE or system installation
        shell: bash
        run: |
          mapfile -t images < <(rg --files --hidden --no-ignore .cache/gnome-wayland-artifacts -g '*.AppImage')
          test "${#images[@]}" -eq 1
          image="$GITHUB_WORKSPACE/${images[0]}"
          chmod +x "$image"
          mkdir -p .cache/gnome-wayland-appimage
          cd .cache/gnome-wayland-appimage
          "$image" --appimage-extract > extract.log
      - name: Verify artifact source commit and test-only differences
        env:
          GH_TOKEN: ${{ github.token }}
          LOLPING_ARTIFACT_RUN_ID: ${{ inputs.linux_artifact_run_id || github.run_id }}
        run: node scripts/verify-reused-linux-build.mjs .cache/gnome-wayland-artifacts .cache/gnome-wayland-appimage/squashfs-root/usr/share/lolping-lite
      - name: Real GNOME Wayland bridge, native settings and private-seat gesture smoke
        run: python3 scripts/test-gnome-wayland.py --root .cache/gnome-wayland-appimage/squashfs-root/usr/share/lolping-lite --executable .cache/gnome-wayland-appimage/squashfs-root/AppRun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lolping-lite-gnome46-wayland-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            dist/gnome-wayland-report.json
            dist/gnome-source-verification.json
            .test-data/gnome-wayland-*/gnome-shell.log
            .test-data/gnome-wayland-*/application.log
            .test-data/gnome-wayland-*/input-client.log
            .test-data/gnome-wayland-*/egl-loader.log
            .test-data/gnome-wayland-*/input-events.json
            .test-data/gnome-wayland-*/mapping-samples.json
            .test-data/gnome-wayland-*/runtime-state.json
            .test-data/gnome-wayland-*/signal.png
            .test-data/gnome-wayland-*/wheel.png

  release-ready:
    name: All three native builds passed
    needs: [build, gnome-wayland]
    runs-on: ubuntu-22.04
    steps:
      - run: echo "All platform builds, package verifications and isolated GNOME Wayland integration passed. Publish only these artifacts from this commit."
