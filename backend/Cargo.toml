[package]
name = "lolping-lite"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "system_fonts", "x11", "wayland", "accesskit"] }
tray-icon = "=0.26.1"
rfd = "=0.17.2"
directories = "=6.0.0"
interprocess = "=2.4.6"
auto-launch = "=0.6.0"
sys-locale = "=0.3.2"
widestring = "=1.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "=0.35.3"
tiny-skia = "=0.12.0"
ttf-parser = "=0.25.1"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }
sha2 = "0.10"
base64 = "0.22"
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "webp", "gif", "jpeg"] }
opus = "=0.4.0"
ogg = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSApplication"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "=0.1.34"
